name: refresh-profile-stats

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (10:17 WIB)
  workflow_dispatch: # manual run button on the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate stats block
        id: stats
        run: python3 scripts/update-stats.py

      - name: commit and push
        if: contains(steps.stats.outputs.stdout, 'STATS_CHANGED')
        run: |
          git config user.name "rubi-stats-bot"
          git config user.email "rubichandrap@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile stats"
          git push
