<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a33d"/>
      <stop offset="1" stop-color="#f0516f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#0d1117"/>
  <rect width="1200" height="6" fill="url(#acc)"/>

  <!-- subtle grid -->
  <g stroke="#161b22" stroke-width="1" opacity="0.9">
    <path d="M120 0V360 M240 0V360 M360 0V360 M480 0V360 M600 0V360 M720 0V360 M840 0V360 M960 0V360 M1080 0V360"/>
    <path d="M0 90H1200 M0 180H1200 M0 270H1200"/>
  </g>

  <!-- glow -->
  <circle cx="1080" cy="40" r="160" fill="url(#acc)" opacity="0.10"/>
  <circle cx="60" cy="340" r="210" fill="url(#acc)" opacity="0.07"/>

  <!-- wordmark -->
  <text x="96" y="196" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="100" font-weight="800" letter-spacing="4" fill="#e6edf3">RUBI<tspan fill="url(#acc)">.</tspan></text>

  <!-- tagline -->
  <text x="98" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#8b949e">software engineer · jakarta, indonesia</text>

  <!-- bio chip -->
  <rect x="98" y="268" width="172" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="118" y="294" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="17" fill="#e8a33d">It depends.</text>

  <!-- years card -->
  <rect x="880" y="80" width="240" height="200" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="1000" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#e6edf3">5+ yrs</text>
  <text x="1000" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#c9d1d9">full-stack</text>
  <text x="1000" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#8b949e">TypeScript-first</text>
</svg>
